[project]
name = "muffin-babel"
version = "1.7.0"
description = "Localization support for the Muffin Framework"
authors = [{ name = "Kirill Klenov", email = "horneds@gmail.com" }]
requires-python = ">=3.11,<4"
readme = "README.md"
license = "MIT"
keywords = ["localization", "internationalization", "muffin", "babel", "asyncio", "trio", "asgi"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Internet :: WWW/HTTP",
  "Framework :: AsyncIO",
  "Framework :: Trio",
]
dependencies = ["asgi-babel", "muffin"]

[project.urls]
Homepage = "https://github.com/klen/muffin-babel"
Repository = "https://github.com/klen/muffin-babel"

[dependency-groups]
dev = [
  "ruff",
  "pyrefly",
  "pre-commit",
  "tox",
  "pytest",
  "pytest-aio[curio, trio]",
  "uvicorn",
  "muffin-jinja2",
]

[build-system]
requires = ["uv_build>=0.9.7,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "muffin_babel"
module-root = ""

[tool.pytest.ini_options]
addopts = "-xsv tests.py"
log_cli = true

[tool.pyrefly]
project-includes = ["muffin_babel"]
project-excludes = ["tests.py", "example", "pyproject.toml"]

[tool.tox]
legacy_tox_ini = """
[tox]
envlist = py311,py312,py313,py314,py315,pypy311

[testenv]
allowlist_externals = uv,pytest
commands =
  uv pip install --system -e . --group dev
	pytest tests.py
"""

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "docs"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "A003",
  "ANN",
  "ARG",
  "COM",
  "D",
  "DJ",
  "EM",
  "FA100",
  "FIX",
  "N",
  "PLC0415",
  "PLR0912",
  "PLR2004",
  "RET",
  "RSE",
  "RUF012",
  "S101",
  "SLF",
  "TD",
  "TRY003",
  "UP",
]

[tool.bumpversion]
tag = false
commit = false
current_version = "1.7.0"

[[tool.bumpversion.files]]
filename = "pyproject.toml"
replace = 'version = "{new_version}"'
search = 'version = "{current_version}"'
